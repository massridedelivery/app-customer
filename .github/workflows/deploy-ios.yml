name: Deploy to TestFlight (iOS)

# Build the PROD flavor (bundle id com.massdrive.customerApp — NOT the .develop
# dev app) and upload it to the "Mass Delivery" TestFlight / App Store app.
#
# Signing depends on external setup (see docs/DEPLOYMENT.md):
#   - the build machine's Apple account is a member of team Q7742Z74Q3
#   - a fastlane match repo holds the Apple Distribution cert + App Store profile
#   - an App Store Connect API key exists
#   - the app record exists in App Store Connect
#
# Which API the build talks to:
#   - manual run (Actions → Run workflow): pick `api`
#       dev  → env/prod-devapi.json (committed) — CI twin of `make deploy_prod_devapi`,
#              the path in use while the prod backend is not up yet
#       prod → env/prod.json, recreated from the PROD_ENV_JSON secret
#   - release/x.x.x tag push: always env/prod.json (PROD_ENV_JSON)
# Once the prod backend is live, drop the `dev` choice together with the
# *_prod_devapi Makefile targets and env/prod-devapi.json.
on:
  workflow_dispatch:
    inputs:
      api:
        description: "Backend the build points at (dev = env/prod-devapi.json, prod = PROD_ENV_JSON secret)"
        type: choice
        options:
          - dev
          - prod
        default: dev
      version:
        description: "App version x.y.z — must be higher than the version already live on the App Store"
        type: string
        required: true
      build_number:
        description: "Build number (optional; default = run number + 10). Must be higher than any build already uploaded for this version"
        type: string
        required: false
  push:
    # Auto-deploy prod when a release/x.x.x tag is pushed. `*` does not match
    # `/`, so this matches release/1.2.3 (one segment after the slash).
    tags:
      - 'release/*'

concurrency:
  group: deploy-ios
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # App Store Connect rejects builds made with an older iOS SDK
      # ("must be built with the iOS 26 SDK or later"). The macos-15 image
      # defaults to an older Xcode, so select the newest stable one installed.
      - name: Select latest Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.6
          channel: stable
          cache: true

      - name: Set up Ruby (for fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
          working-directory: ios

      - name: Install dependencies
        run: flutter pub get

      # Generated sources (*.g.dart, *.freezed.dart) are gitignored, so they
      # must be regenerated on a fresh checkout before the build can compile.
      - name: Generate code (freezed / riverpod / json_serializable)
        run: dart run build_runner build --delete-conflicting-outputs

      # Pick the dart-define file. env/prod-devapi.json is committed; env/prod.json
      # is gitignored, so it is recreated from the secret. Tag pushes have no
      # inputs, so they always take the real-prod path.
      - name: Select env file
        env:
          API: ${{ inputs.api || 'prod' }}
          PROD_ENV_JSON: ${{ secrets.PROD_ENV_JSON }}
        run: |
          if [ "$API" = "dev" ]; then
            ENV_FILE=env/prod-devapi.json
          else
            ENV_FILE=env/prod.json
            printf '%s' "$PROD_ENV_JSON" > "$ENV_FILE"
          fi
          echo "ENV_FILE=$ENV_FILE" >> "$GITHUB_ENV"
          # Log the non-secret routing values so the run shows which API it used.
          grep -E '"(FLAVOR|APP_NAME|API_BASE_URL|WS_BASE_URL)"' "$ENV_FILE"

      # --config-only compiles no binary; it writes the dart-defines, version
      # name and build number into ios/Flutter/Generated.xcconfig so the
      # subsequent fastlane/gym archive picks them up.
      # --flavor prod selects the `prod` scheme / Release-prod configuration,
      # which resolves BUNDLE_ID_SUFFIX to empty -> com.massdrive.customerApp.
      # Default build number = run number + 10, matching the Android pipeline's
      # scheme; the build_number input overrides it.
      - name: Configure iOS build (dart-defines + version + build number)
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_BUILD_NUMBER: ${{ inputs.build_number }}
        run: |
          # Version: the dispatch input, else x.x.x from a release/x.x.x tag,
          # else pubspec.yaml's version.
          VERSION="$INPUT_VERSION"
          if [ -z "$VERSION" ] && [ "$GITHUB_REF_TYPE" = "tag" ]; then
            VERSION="${GITHUB_REF_NAME##*/}"
          fi
          BUILD_NAME_ARG=""
          if [ -n "$VERSION" ]; then
            if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::version must be x.y.z, got '$VERSION'"; exit 1
            fi
            BUILD_NAME_ARG="--build-name=$VERSION"
          fi
          BUILD_NUMBER="${INPUT_BUILD_NUMBER:-$((GITHUB_RUN_NUMBER + 10))}"
          if ! [[ "$BUILD_NUMBER" =~ ^[0-9]+$ ]]; then
            echo "::error::build_number must be an integer, got '$BUILD_NUMBER'"; exit 1
          fi
          echo "Building com.massdrive.customerApp ${VERSION:-<pubspec>} ($BUILD_NUMBER) with $ENV_FILE"
          flutter build ios --config-only --release --flavor prod \
            --dart-define-from-file="$ENV_FILE" \
            $BUILD_NAME_ARG \
            --build-number="$BUILD_NUMBER"

      - name: Install CocoaPods
        working-directory: ios
        run: bundle exec pod install

      - name: Build & upload to TestFlight
        working-directory: ios
        env:
          MATCH_GIT_URL: ${{ secrets.MATCH_GIT_URL }}
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          MATCH_GIT_BASIC_AUTHORIZATION: ${{ secrets.MATCH_GIT_BASIC_AUTHORIZATION }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: bundle exec fastlane beta
