name: CI

# Runs on every pull request and on pushes to the main branches.
# Fast quality gate: format check, static analysis, and tests.
on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.41.6"

jobs:
  analyze-and-test:
    name: Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated code (freezed models + riverpod providers + json) is
      # git-ignored, so a fresh checkout has none of it. Without this step the
      # analyzer/tests see every generated getter and *Provider as undefined.
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Non-blocking: the existing codebase is not fully dart-formatted yet.
      # This surfaces drift without failing the build. Flip to a hard gate
      # (remove continue-on-error) once the codebase is formatted once.
      - name: Check formatting (non-blocking)
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed .

      # Analyzer currently reports info-level lints only; treat warnings/errors
      # as fatal but allow infos so the gate is meaningful without being noisy.
      - name: Analyze
        run: flutter analyze --no-fatal-infos

      # Golden tests are excluded: they compare rendered pixels against
      # reference PNGs and drift by <0.1% across host fonts/rendering (they were
      # captured on macOS; CI is Ubuntu), so they fail on CI without being real
      # regressions. Run them locally with: flutter test --tags golden
      - name: Run tests
        run: flutter test --exclude-tags golden --reporter expanded

  build-android:
    name: Build Android (debug sanity)
    runs-on: ubuntu-latest
    needs: analyze-and-test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Same as the analyze job: generated code is git-ignored, so the app
      # won't compile without regenerating it first.
      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      # Debug build only — confirms the Android project compiles on every PR
      # without needing release signing secrets. The app has product flavors
      # (env/dev.json is committed), so build the dev flavor.
      - name: Build debug APK
        run: flutter build apk --debug --flavor dev --dart-define-from-file=env/dev.json
